<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Moneta</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%232a78d6'/%3E%3Ccircle cx='16' cy='16' r='6' fill='none' stroke='%23fff' stroke-width='3'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <h1>Moneta</h1>
      </div>
      <div class="topbar-actions">
        <span id="updated" class="updated" aria-live="polite"></span>
        <button id="refresh" class="btn" type="button" hidden>Refresh</button>
      </div>
    </header>

    <nav class="nav" aria-label="Screens">
      <a class="nav-link" href="#/balances" data-screen="balances">Balances</a>
      <a class="nav-link" href="#/accounts" data-screen="accounts">Accounts</a>
    </nav>

    <main id="main">
      <section id="gate" hidden></section>
      <section id="notice" class="notice" role="status" hidden></section>

      <div id="screen-balances" class="screen">
        <section id="totals" class="totals" aria-label="Totals per currency"></section>
        <section class="accounts-block" aria-label="Accounts">
          <div id="view-toggle" class="list-tools" role="group" aria-label="Group accounts by" hidden>
            <div class="segmented">
              <button type="button" class="seg-btn" data-view="type" aria-pressed="true">By type</button>
              <button type="button" class="seg-btn" data-view="bank" aria-pressed="false">By bank</button>
            </div>
          </div>
          <div id="accounts" class="accounts"></div>
        </section>
      </div>

      <div id="screen-accounts" class="screen" hidden>
        <nav id="account-picker" class="chips" aria-label="Choose an account"></nav>
        <div class="activity-bar">
          <div id="activity-head" class="activity-head"></div>
          <nav id="period-picker" class="month-nav" aria-label="Months shown"></nav>
        </div>
        <div id="sheet-wrap" class="sheet-wrap">
          <div id="sheet" class="sheet"></div>
        </div>
        <p id="sheet-note" class="sheet-note" hidden>Transfers between your own accounts are listed but left out of income, outgoings and net. Tap any figure to see the transactions behind it.</p>
        <section id="drill" class="txns" aria-label="Transactions" hidden></section>
      </div>
    </main>

    <footer class="footer">
      <span>Balances come from your <a href="https://lunchflow.app" rel="noreferrer">Lunch Flow</a> account.</span>
      <span id="cache-hint"></span>
      <button id="lock" class="link-btn" type="button" hidden>Lock this page</button>
    </footer>

    <dialog id="editor" class="editor" aria-labelledby="editor-title">
      <form id="editor-form" novalidate>
        <h2 id="editor-title">Account</h2>
        <p id="editor-sub" class="editor-sub"></p>

        <label class="field">
          <span>Group</span>
          <select id="editor-group"></select>
        </label>

        <label class="field">
          <span>Balance</span>
          <select id="editor-balance">
            <option value="reported">As reported</option>
            <option value="negate">Amount owed, shown as negative</option>
            <option value="credit-limit">Amount left to spend on a card</option>
          </select>
        </label>

        <label class="field" id="editor-limit-field" hidden>
          <span>Credit limit</span>
          <input id="editor-limit" type="number" inputmode="decimal" min="0" step="0.01" placeholder="e.g. 5000" />
        </label>

        <p id="editor-explain" class="editor-explain"></p>
        <p id="editor-error" class="editor-error" role="alert" hidden></p>
        <p id="editor-hint" class="editor-hint"></p>

        <div class="editor-actions">
          <button type="button" class="btn btn--ghost" id="editor-cancel">Cancel</button>
          <button type="submit" class="btn" id="editor-save">Save</button>
        </div>
      </form>
    </dialog>

    <dialog id="catpicker" class="editor editor--wide" aria-labelledby="catpicker-title">
      <form id="catpicker-form" novalidate>
        <h2 id="catpicker-title">Transaction</h2>
        <p id="catpicker-sub" class="editor-sub"></p>
        <div id="catpicker-groups" class="optgroups"></div>
        <fieldset class="scope">
          <legend class="sr-only">Apply to</legend>
          <label class="radio"><input type="radio" name="scope" value="merchant" id="scope-merchant" /><span id="scope-merchant-label">Always for this merchant</span></label>
          <label class="radio"><input type="radio" name="scope" value="one" id="scope-one" /><span>Just this one</span></label>
        </fieldset>
        <p id="catpicker-error" class="editor-error" role="alert" hidden></p>
        <p id="catpicker-hint" class="editor-hint"></p>
        <div class="editor-actions">
          <button type="button" class="btn btn--ghost" id="catpicker-cancel">Cancel</button>
          <button type="submit" class="btn" id="catpicker-save">Save</button>
        </div>
      </form>
    </dialog>

    <script type="module" src="/app.js"></script>
  </body>
</html>
